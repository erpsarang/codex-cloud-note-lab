name: Self-Improvement Candidate

on:
  # This privileged event makes repository secrets available after fork and
  # Dependabot PRs merge. Never check out or execute the untrusted PR head.
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: self-improvement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  self-improvement:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      improvement-candidate: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Check out latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Observe repository and propose a meaningful improvement
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bot-users: self-improvement-trusted-merge[bot]
          sandbox: read-only
          output-file: improvement-candidate.md
          prompt: |
            최신 상태로 체크아웃된 저장소와 테스트를 관찰하세요. 이미 구현된
            개선사항을 검토한 다음, 이 저장소에서 직접 검증할 수 있는 새로운
            근거를 찾으세요. 이전 작업과 중복되지 않는 개선 후보가 아래 가치 축
            중 하나 이상에서 명확하고 검증 가능한 효과가 있을 때만 선정하세요.

            - 사용자 영향, 데이터 무결성, 장애 복구, 보안, 접근성
            - 명확히 재현 가능한 defect
            - 유지보수 비용 또는 개발/운영 위험의 실질적인 감소

            도달하기 어려운 입력을 위한 방어 코딩, 중복 테스트, 사소한 스타일
            정리만 남았다면 후보를 억지로 만들지 마세요. 그 경우 다른 텍스트나
            Markdown 없이 정확히 다음 한 줄만 반환하세요.

            NO_MEANINGFUL_CANDIDATE

            읽기 전용 모드로 작업하세요. 파일을 수정하거나, commit을 만들거나,
            pull request 또는 GitHub issue를 생성하지 마세요.

            다음 제목을 모두 포함한 간결한 Markdown 보고서만 반환하세요.

            ## 관찰
            ## 근거
            ## 개선 후보
            ## 이 후보를 선정한 이유
            ## 기대 변경사항
            ## 검증 방법
            ## 위험요소

            가능하면 근거에 저장소 파일 경로와 줄 번호를 인용하세요. 추측이
            아니라 저장소에서 확인한 근거를 바탕으로 모든 내용을 작성하세요.

      - name: Validate observation result
        id: observation
        run: |
          set -euo pipefail
          if ! grep -q '[^[:space:]]' improvement-candidate.md; then
            echo "improvement-candidate.md is empty or contains only whitespace" >&2
            exit 1
          fi
          if [ "$(tr -d '\r' < improvement-candidate.md)" = 'NO_MEANINGFUL_CANDIDATE' ]; then
            echo 'meaningful=false' >> "$GITHUB_OUTPUT"
            echo 'No meaningful candidate found; completing successfully without creating an issue'
            exit 0
          fi
          for heading in '## 관찰' '## 근거' '## 개선 후보' '## 이 후보를 선정한 이유' \
            '## 기대 변경사항' '## 검증 방법' '## 위험요소'; do
            grep -Fx "$heading" improvement-candidate.md >/dev/null || {
              echo "Missing required candidate heading: $heading" >&2
              exit 1
            }
          done
          echo 'meaningful=true' >> "$GITHUB_OUTPUT"

      - name: Create improvement candidate issue
        if: steps.observation.outputs.meaningful == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGERING_PR: ${{ github.event.pull_request.number }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- self-improvement-trigger-pr:${TRIGGERING_PR} -->"
          existing_issue="$(
            gh api --paginate "repos/$GH_REPO/issues?state=all&per_page=100" \
              --jq ".[] | select((has(\"pull_request\") | not) and ((.body // \"\") | contains(\"$marker\"))) | .number"
          )"

          if [ -n "$existing_issue" ]; then
            existing_issue="${existing_issue%%$'\n'*}"
            echo "PR #$TRIGGERING_PR에 대해 기존 자기개선 후보 issue #$existing_issue를 재사용합니다"
            exit 0
          fi

          cat improvement-candidate.md > issue-body.md
          printf '\n\n%s\n---\n트리거 PR: #%s\n트리거 workflow 실행: %s\nSelf-Improvement workflow에서 자동으로 생성했습니다.\n' \
            "$marker" "$TRIGGERING_PR" "$WORKFLOW_RUN_URL" >> issue-body.md

          gh issue create \
            --title "Self-Improvement Candidate | 자기개선 후보" \
            --body-file issue-body.md

      - name: Upload improvement candidate
        uses: actions/upload-artifact@v4
        with:
          name: improvement-candidate
          path: improvement-candidate.md
          if-no-files-found: error
