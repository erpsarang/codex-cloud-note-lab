name: Self-Improvement Candidate

on:
  # This privileged event makes repository secrets available after fork and
  # Dependabot PRs merge. Never check out or execute the untrusted PR head.
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  self-improvement:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      improvement-candidate: ${{ steps.codex.outputs.final-output }}

    steps:
      - name: Check out latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Observe repository and propose one improvement
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-args: '["--sandbox", "read-only"]'
          prompt: |
            Observe the latest checked-out repository and its tests. Review the
            improvements that are already implemented, then find new evidence
            that can be verified directly in this repository. Select exactly one
            small Improvement Candidate that does not duplicate prior work.

            Work in read-only mode. Do not modify any files, create commits,
            open pull requests, or create GitHub issues.

            Return only a concise Markdown report with all of these headings:

            ## Observation
            ## Evidence
            ## Improvement Candidate
            ## Why this candidate
            ## Expected Change
            ## Verification
            ## Risks

            Cite repository file paths and line numbers in the evidence whenever
            possible. Base every claim on repository evidence, not speculation.

      - name: Save improvement candidate
        env:
          IMPROVEMENT_CANDIDATE: ${{ steps.codex.outputs.final-output }}
        run: printf '%s\n' "$IMPROVEMENT_CANDIDATE" > improvement-candidate.md

      - name: Upload improvement candidate
        uses: actions/upload-artifact@v4
        with:
          name: improvement-candidate
          path: improvement-candidate.md
          if-no-files-found: error
