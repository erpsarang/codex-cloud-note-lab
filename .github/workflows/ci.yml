name: CI
run-name: prospective-merge-${{ inputs.tested_base_sha || github.sha }}-${{ inputs.tested_head_sha || github.sha }}-${{ inputs.contract_nonce || github.sha }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tested_base_sha:
        description: Exact default-branch commit to merge into
        required: true
        type: string
      tested_head_sha:
        description: Exact candidate commit to merge
        required: true
        type: string
      contract_nonce:
        description: Unique review run identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    # Approval Automation publishes these bot-owned branches only for the
    # prospective workflow_dispatch path below. Keep normal and infrastructure
    # pull requests on this check, including similarly named human-owned PRs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'github-actions[bot]' ||
      !startsWith(github.event.pull_request.head.ref, 'codex/self-improvement-') ||
      !startsWith(github.event.pull_request.title, '자기개선 후보 #')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Construct prospective merge tree
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_SHA: ${{ inputs.tested_base_sha }}
          HEAD_SHA: ${{ inputs.tested_head_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git switch --detach "$BASE_SHA"
          git -c user.name=ci -c user.email=ci@example.invalid \
            merge --no-commit --no-ff "$HEAD_SHA"
          result_tree="$(git write-tree)"
          # The result tree is checked by the trusted caller independently. This
          # untrusted execution workflow deliberately publishes no evidence artifact.
          git write-tree | grep -Fx "$result_tree"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
