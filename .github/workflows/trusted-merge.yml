name: Trusted Merge

on:
  repository_dispatch:
    types: [self-improvement-trusted-merge]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: trusted-merge-${{ github.event.client_payload.review_run_id }}-${{ github.event.client_payload.review_run_attempt }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: self-improvement-trusted-merge
    steps:
      # No checkout, package installation, repository script, or AI action is
      # permitted in this workflow. Treat the dispatch payload only as lookup
      # coordinates, then authenticate the exact completed Review run and its
      # single retained contract artifact through the Actions API.
      - name: Authenticate Review run and download its exact MERGE_READY artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVIEW_RUN_ID: ${{ github.event.client_payload.review_run_id }}
          REVIEW_RUN_ATTEMPT: ${{ github.event.client_payload.review_run_attempt }}
          REVIEW_WORKFLOW_SOURCE_SHA: ${{ github.event.client_payload.review_workflow_source_sha }}
        run: |
          set -euo pipefail
          case "$REVIEW_RUN_ID" in ''|*[!0-9]*) exit 1;; esac
          case "$REVIEW_RUN_ATTEMPT" in ''|*[!0-9]*) exit 1;; esac
          [[ "$REVIEW_WORKFLOW_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          for attempt in $(seq 1 30); do
            review_run="$(gh api "repos/$GH_REPO/actions/runs/$REVIEW_RUN_ID/attempts/$REVIEW_RUN_ATTEMPT")"
            status="$(jq -r .status <<<"$review_run")"
            [ "$status" != completed ] || break
            sleep 2
          done
          jq -e --argjson review_attempt "$REVIEW_RUN_ATTEMPT" \
            --arg sha "$REVIEW_WORKFLOW_SOURCE_SHA" --arg branch "$DEFAULT_BRANCH" '
            .name == "Self-Improvement Review" and
            .path == ".github/workflows/review-fix.yml" and
            .event == "repository_dispatch" and .status == "completed" and
            .conclusion == "success" and .run_attempt == $review_attempt and
            .head_sha == $sha and .head_branch == $branch
          ' <<<"$review_run" >/dev/null

          artifacts="$(gh api --paginate "repos/$GH_REPO/actions/runs/$REVIEW_RUN_ID/artifacts?per_page=100" --slurp)"
          artifact_pattern="^merge-ready-$REVIEW_RUN_ID-$REVIEW_RUN_ATTEMPT-[0-9]+-[0-9a-f]{40}$"
          artifact_id="$(jq -r --arg pattern "$artifact_pattern" '
            [.[].artifacts[] |
             select(.expired == false and (.name | test($pattern)))] |
            if length == 1 then .[0].id else empty end
          ' <<<"$artifacts")"
          test -n "$artifact_id"
          mkdir -p "$RUNNER_TEMP/ready"
          gh api "repos/$GH_REPO/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/merge-ready.zip"
          test "$(unzip -Z1 "$RUNNER_TEMP/merge-ready.zip" | grep -Fx 'merge-ready.json' | wc -l)" -eq 1
          unzip -p "$RUNNER_TEMP/merge-ready.zip" merge-ready.json > "$RUNNER_TEMP/ready/merge-ready.json"

      - name: Validate trusted state and merge exact head
        id: merge
        env:
          GH_TOKEN: ${{ secrets.SELF_IMPROVEMENT_MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONTRACT: ${{ runner.temp }}/ready/merge-ready.json
          REVIEW_RUN_ID: ${{ github.event.client_payload.review_run_id }}
          REVIEW_RUN_ATTEMPT: ${{ github.event.client_payload.review_run_attempt }}
          REVIEW_WORKFLOW_SOURCE_SHA: ${{ github.event.client_payload.review_workflow_source_sha }}
        run: |
          set -euo pipefail
          test -f "$CONTRACT"
          jq -e '.version == 2 and .finalReview == "PASS" and
            .finalReviewSha == .headSha and .testResult == "PASS" and
            .testedBaseSha == .baseSha and .testedHeadSha == .headSha and
            (.testedResultTree | test("^[0-9a-f]{40}$")) and
            (.ciWorkflowSourceSha | test("^[0-9a-f]{40}$")) and (.ciRunId > 0) and
            (.reviewWorkflowSourceSha | test("^[0-9a-f]{40}$")) and
            (.reviewRunId > 0) and (.reviewRunAttempt > 0) and
            .ciContext == "test" and .ciResult == "success" and
            (.publicationRunId > 0) and (.publicationRunAttempt > 0) and
            ((.staleRecoveryCount == 0) or (.staleRecoveryCount == 1)) and
            (has("reviewFixAttempts") | not)' "$CONTRACT" >/dev/null
          jq -e --argjson run "$REVIEW_RUN_ID" --argjson attempt "$REVIEW_RUN_ATTEMPT" \
            --arg source "$REVIEW_WORKFLOW_SOURCE_SHA" '
            .reviewRunId == $run and .reviewRunAttempt == $attempt and
            .reviewWorkflowSourceSha == $source
          ' "$CONTRACT" >/dev/null

          candidate="$(jq -r .candidate "$CONTRACT")"
          pr_number="$(jq -r .pullRequest "$CONTRACT")"
          expected_head="$(jq -r .headSha "$CONTRACT")"
          expected_base="$(jq -r .baseSha "$CONTRACT")"
          expected_tree="$(jq -r .testedResultTree "$CONTRACT")"
          ci_run_id="$(jq -r .ciRunId "$CONTRACT")"
          ci_workflow_source_sha="$(jq -r .ciWorkflowSourceSha "$CONTRACT")"
          expected_fingerprint="$(jq -r .requirementsFingerprint "$CONTRACT")"
          publication_run_id="$(jq -r .publicationRunId "$CONTRACT")"
          publication_run_attempt="$(jq -r .publicationRunAttempt "$CONTRACT")"
          stale_recovery_count="$(jq -r .staleRecoveryCount "$CONTRACT")"

          # Independently re-read the immutable Approval Automation artifact;
          # mutable PR names, titles, branches, and bodies grant no authority.
          publication_run="$(gh api "repos/$GH_REPO/actions/runs/$publication_run_id")"
          jq -e --arg workflow ".github/workflows/approval-automation.yml" \
            '.event == "issues" and .conclusion == "success" and
             .path == $workflow' <<<"$publication_run" >/dev/null
          publication_artifacts="$(gh api --paginate "repos/$GH_REPO/actions/runs/$publication_run_id/artifacts?per_page=100" --slurp)"
          publication_artifact="$(jq -r --arg name "candidate-publication-$publication_run_id-$publication_run_attempt" \
            '.[].artifacts[] | select(.name == $name and .expired == false) | .id' <<<"$publication_artifacts")"
          test "$(wc -l <<<"$publication_artifact")" -eq 1
          gh api "repos/$GH_REPO/actions/artifacts/$publication_artifact/zip" > "$RUNNER_TEMP/publication.zip"
          unzip -p "$RUNNER_TEMP/publication.zip" publication-provenance.json > "$RUNNER_TEMP/publication.json"
          publication_source_branch="$(jq -r .publicationSourceBranch "$RUNNER_TEMP/publication.json")"
          expected_publication_workflow="$GH_REPO/.github/workflows/approval-automation.yml@refs/heads/$publication_source_branch"
          jq -e --argjson candidate "$candidate" --argjson pr "$pr_number" \
            --arg head "$expected_head" --arg fingerprint "$expected_fingerprint" \
            --argjson run "$publication_run_id" --argjson attempt "$publication_run_attempt" \
            --arg workflow "$expected_publication_workflow" \
            '.candidate==$candidate and .pullRequest==$pr and .publishedHeadSha==$head and
             .requirementsFingerprint==$fingerprint and .publicationRunId==$run and
             .publicationRunAttempt==$attempt and .publicationWorkflow==$workflow' "$RUNNER_TEMP/publication.json" >/dev/null
          jq -e --arg sha "$(jq -r .publicationSourceSha "$RUNNER_TEMP/publication.json")" \
            --arg ref "$publication_source_branch" \
            '.head_sha == $sha and .head_branch == $ref' <<<"$publication_run" >/dev/null

          issue="$(gh api "repos/$GH_REPO/issues/$candidate")"
          jq -e '.state == "open" and ([.labels[].name] | index("approved") != null)' <<<"$issue" >/dev/null
          actual_fingerprint="$(jq -r .body <<<"$issue" | sha256sum | cut -d' ' -f1)"
          [ "$actual_fingerprint" = "$expected_fingerprint" ]

          pr="$(gh api "repos/$GH_REPO/pulls/$pr_number")"
          jq -e --arg head "$expected_head" --arg branch "$DEFAULT_BRANCH" \
            '.state == "open" and .draft == false and .head.sha == $head and
             .base.ref == $branch' <<<"$pr" >/dev/null

          # The tested base identifies the prospective tree; it is intentionally
          # distinct from the trusted commit that supplied the nested workflow.
          ci_run="$(gh api "repos/$GH_REPO/actions/runs/$ci_run_id")"
          jq -e --arg source "$ci_workflow_source_sha" --arg branch "$DEFAULT_BRANCH" \
            '.name == "CI" and .event == "workflow_dispatch" and .conclusion == "success" and
             .path == ".github/workflows/ci.yml" and .head_branch == $branch and
             .head_sha == $source and .run_attempt == 1' <<<"$ci_run" >/dev/null

          gh api "repos/$GH_REPO/pulls/$pr_number/files?per_page=100" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' |
            if grep -Eq '^\.github/(workflows|actions)/'; then exit 1; fi

          # Never merge evidence tested against a stale base. One new Review may
          # be requested for the unchanged candidate head and current base. If
          # that replacement also goes stale, fail closed instead of looping.
          current_base="$(gh api "repos/$GH_REPO/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)"
          if [ "$current_base" != "$expected_base" ]; then
            [ "$stale_recovery_count" -eq 0 ]
            jq -e --arg head "$expected_head" --arg base "$current_base" --arg branch "$DEFAULT_BRANCH" \
              '.state == "open" and .head.sha == $head and .base.sha == $base and .base.ref == $branch' <<<"$pr" >/dev/null
            printf 'stale=true\ncurrent_base=%s\npr=%s\nhead=%s\npublication_run_id=%s\npublication_run_attempt=%s\n' \
              "$current_base" "$pr_number" "$expected_head" "$publication_run_id" "$publication_run_attempt" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'stale=false' >> "$GITHUB_OUTPUT"
          # GitHub may temporarily report mergeable=null while recomputing after
          # a base update. Require mergeability only after ruling out stale evidence.
          jq -e --arg base "$expected_base" \
            '.base.sha == $base and .mergeable == true' <<<"$pr" >/dev/null

          # Build a commit with the exact tested result tree, then update the default
          # branch with a server-side compare-and-swap. Unlike the pull merge API's
          # head-only `sha` guard, force-with-lease rejects the push atomically if
          # expected_base is no longer the branch tip. No worktree is created and no
          # candidate code, hook, package, or test is executed in Trusted Merge.
          git init "$RUNNER_TEMP/atomic-merge"
          cd "$RUNNER_TEMP/atomic-merge"
          git config core.hooksPath /dev/null
          git remote add origin "https://github.com/$GH_REPO.git"
          gh auth setup-git
          git fetch --no-tags origin "$expected_base" "$expected_head"
          actual_tree="$(git merge-tree --write-tree "$expected_base" "$expected_head")"
          [ "$actual_tree" = "$expected_tree" ]
          merge_commit="$(printf 'Self-Improvement candidate #%s (PR #%s)\n' "$candidate" "$pr_number" |
            git -c user.name='Self-Improvement Trusted Merge' \
                -c user.email='self-improvement@users.noreply.github.com' \
                commit-tree "$expected_tree" -p "$expected_base" -p "$expected_head")"
          git push origin "$merge_commit:refs/heads/$DEFAULT_BRANCH" \
            --force-with-lease="refs/heads/$DEFAULT_BRANCH:$expected_base"

          # GitHub should recognize the head as merged after the atomic ref update.
          gh api "repos/$GH_REPO/pulls/$pr_number" --jq .merged | grep -Fx true

      - name: Request one current-base revalidation without merge authority
        id: revalidate
        if: steps.merge.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.merge.outputs.pr }}
          HEAD_SHA: ${{ steps.merge.outputs.head }}
          CURRENT_BASE: ${{ steps.merge.outputs.current_base }}
          PUBLICATION_RUN_ID: ${{ steps.merge.outputs.publication_run_id }}
          PUBLICATION_RUN_ATTEMPT: ${{ steps.merge.outputs.publication_run_attempt }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GH_REPO/dispatches" \
            -f event_type=self-improvement-review \
            -F "client_payload[pr_number]=$PR_NUMBER" \
            -F "client_payload[publication_run_id]=$PUBLICATION_RUN_ID" \
            -F "client_payload[publication_run_attempt]=$PUBLICATION_RUN_ATTEMPT" \
            -F 'client_payload[stale_recovery_count]=1' \
            -f "client_payload[stale_recovery_base_sha]=$CURRENT_BASE" \
            -f "client_payload[stale_recovery_head_sha]=$HEAD_SHA"

      - name: Put a changed or unverifiable candidate ON_HOLD
        if: ${{ failure() && !(steps.merge.outputs.stale == 'true' && steps.revalidate.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONTRACT: ${{ runner.temp }}/ready/merge-ready.json
        run: |
          set -euo pipefail
          test -f "$CONTRACT" || exit 0
          candidate="$(jq -r '.candidate // empty' "$CONTRACT")"
          test -n "$candidate" || exit 0
          gh label create ON_HOLD --repo "$GH_REPO" --color B60205 \
            --description 'Automated merge is paused pending investigation' --force
          gh issue edit "$candidate" --repo "$GH_REPO" --add-label ON_HOLD
