name: Trusted Merge

on:
  workflow_run:
    workflows: [Self-Improvement Review Fix]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: trusted-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: self-improvement-trusted-merge
    steps:
      # No checkout, package installation, repository script, or AI action is
      # permitted in this workflow. The artifact is bound to the completed run.
      - name: Download MERGE_READY from the completed Review/Fix run
        uses: actions/download-artifact@v4
        with:
          pattern: merge-ready-*
          path: ${{ runner.temp }}/ready
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate trusted state and merge exact head
        env:
          GH_TOKEN: ${{ secrets.SELF_IMPROVEMENT_MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONTRACT: ${{ runner.temp }}/ready/merge-ready.json
        run: |
          set -euo pipefail
          test -f "$CONTRACT"
          jq -e '.version == 1 and .finalReview == "PASS" and
            .finalReviewSha == .headSha and .testResult == "PASS" and
            .testedBaseSha == .baseSha and .testedHeadSha == .headSha and
            (.testedResultTree | test("^[0-9a-f]{40}$")) and (.ciRunId > 0) and
            .ciContext == "test" and .ciResult == "success" and
            (.reviewFixAttempts >= 0 and .reviewFixAttempts <= 3)' "$CONTRACT" >/dev/null

          candidate="$(jq -r .candidate "$CONTRACT")"
          pr_number="$(jq -r .pullRequest "$CONTRACT")"
          expected_head="$(jq -r .headSha "$CONTRACT")"
          expected_base="$(jq -r .baseSha "$CONTRACT")"
          ci_run_id="$(jq -r .ciRunId "$CONTRACT")"
          expected_fingerprint="$(jq -r .requirementsFingerprint "$CONTRACT")"

          issue="$(gh api "repos/$GH_REPO/issues/$candidate")"
          jq -e '.state == "open" and ([.labels[].name] | index("approved") != null)' <<<"$issue" >/dev/null
          actual_fingerprint="$(jq -r .body <<<"$issue" | sha256sum | cut -d' ' -f1)"
          [ "$actual_fingerprint" = "$expected_fingerprint" ]

          # Fail closed if the default branch moved after the tested merge was built.
          current_base="$(gh api "repos/$GH_REPO/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)"
          [ "$current_base" = "$expected_base" ]

          pr="$(gh api "repos/$GH_REPO/pulls/$pr_number")"
          jq -e --arg head "$expected_head" --arg base "$expected_base" --arg branch "$DEFAULT_BRANCH" \
            '.state == "open" and .draft == false and .head.sha == $head and
             .base.sha == $base and .base.ref == $branch and .mergeable == true' <<<"$pr" >/dev/null

          gh api "repos/$GH_REPO/actions/runs/$ci_run_id" \
            --jq '[.name, .event, .conclusion, .head_sha] | @tsv' |
            grep -Fx $'CI\tworkflow_dispatch\tsuccess\t'"$expected_base"

          gh api "repos/$GH_REPO/pulls/$pr_number/files?per_page=100" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' |
            if grep -Eq '^\.github/(workflows|actions)/'; then exit 1; fi

          result="$(gh api --method PUT "repos/$GH_REPO/pulls/$pr_number/merge" \
            -f merge_method=squash -f sha="$expected_head")"
          jq -e '.merged == true' <<<"$result" >/dev/null

      - name: Put a changed or unverifiable candidate ON_HOLD
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONTRACT: ${{ runner.temp }}/ready/merge-ready.json
        run: |
          set -euo pipefail
          test -f "$CONTRACT" || exit 0
          candidate="$(jq -r '.candidate // empty' "$CONTRACT")"
          test -n "$candidate" || exit 0
          gh issue edit "$candidate" --repo "$GH_REPO" --add-label ON_HOLD
