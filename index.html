<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메모</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="note-app">
      <h1>메모</h1>
      <form id="note-form">
        <label for="note-input">새 메모</label>
        <textarea
          id="note-input"
          rows="4"
          placeholder="메모를 입력하세요"
          aria-describedby="note-error"
        ></textarea>
        <p id="note-error" role="alert" hidden>메모 내용을 입력하세요.</p>
        <button type="submit">Add Note</button>
      </form>
      <p id="storage-status" role="status" hidden>
        변경 사항이 이 브라우저에 저장되지 않았습니다.
      </p>
      <ul id="note-list" aria-live="polite"></ul>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
